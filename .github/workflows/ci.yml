name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    name: Validate (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check Pint config
        run: composer format:check

      - name: Run Pint PHPDoc rules smoke test
        run: composer format:rules-smoke

      - name: Audit Pint rules coverage
        run: composer audit:pint

      - name: Run PHPStan integration fixture
        run: composer analyse

      - name: Run PHPStan level rules smoke test
        run: composer analyse:rules-smoke
